<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergIQ - Soluciones Energéticas</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <!-- Encabezado de la empresa -->
    <div class="company-header">
      <h1>EnergIQ</h1>
      <p>Optimizing energy, Empowering the future.</p>
    </div>

    <!-- Encabezado del cliente -->
    <div class="client-header">
      <h2>Nova GNC</h2>
    </div>

    <main class="main-container">
      <div class="content-wrapper">
        <section class="container-left" id="containerA">
          <!-- <h2>Datos Principales</h2> -->
          <div class="auto-reload-container">
            <span class="auto-reload-label">Recarga automática:</span>
            <label class="toggle-switch">
              <input type="checkbox" id="autoReloadToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="date-selector-container">
            <label for="dateSelector">Seleccione una fecha:</label>
            <select id="dateSelector" class="date-selector">
              <!-- Se completa automatico -->
            </select>
          </div>
          <div class="summary-info">
            <div class="calendar-header">
              <h3>Registros Diarios</h3>
              <div class="calendar-legend"></div>
            </div>
            <div id="calendarChart" class="calendar-container"></div>
          </div>
        </section>

        <section class="container-right">
          <div class="container-top" id="containerB">
            <h2>Análisis Energético</h2>
            <div class="chart-container" id="lineChartContainer"></div>
          </div>

          <div class="container-bottom" id="containerC">
            <h2>Eficiencia Comparativa</h2>
            <div class="chart-container" id="paretoChart2"></div>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      import "./script/main.js";

      // Inicialización después de carga completa
      document.addEventListener("DOMContentLoaded", function () {
        initCalendar();

        // Forzar una actualización inicial si es necesario
        setTimeout(() => {
          if (window.updateDisplay && processedData) {
            const lastDate =
              processedData.uniqueDates[processedData.uniqueDates.length - 1];
            window.updateDisplay(lastDate, processedData);
          }
        }, 500);
      });
    </script>
  </body>
</html>
